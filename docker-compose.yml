services:
  prototype:
    build:
      context: ./prototype/high-fidelity
      target: development
    container_name: daria-studio-prototype
    ports:
      - "5173:5173"
    volumes:
      - ./prototype/high-fidelity:/app
      - prototype_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev

volumes:
  prototype_node_modules:
