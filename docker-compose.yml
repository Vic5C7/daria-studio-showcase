services:
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: dg-photography-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev

volumes:
  frontend_node_modules:
